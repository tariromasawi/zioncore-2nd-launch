name: Deploy ZionCore 2nd production

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: Select deploy only after required production resources are ready
        required: true
        type: choice
        options:
          - do-not-deploy
          - deploy-zioncore-2nd-production
        default: do-not-deploy

permissions:
  contents: read

concurrency:
  group: zioncore-2nd-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.release_confirmation == 'deploy-zioncore-2nd-production' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: zioncore-2nd-production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: zioncore-2nd-production
      GCP_REGION: europe-west2
      API_SERVICE: zioncore-2nd-api
      PUBLIC_ORIGIN: https://zioncore-2nd-production.web.app
      VITE_PUBLIC_SITE_URL: https://zioncore-2nd-production.web.app
      VITE_ZIONCORE_2ND_FIREBASE_PROJECT_ID: zioncore-2nd-production
      VITE_ZIONCORE_2ND_FIREBASE_AUTH_DOMAIN: zioncore-2nd-production.firebaseapp.com
      VITE_ZIONCORE_2ND_FIREBASE_APP_ID: 1:225578874852:web:df2ab8ae1735860719b9f1
      VITE_ZIONCORE_2ND_FIREBASE_MESSAGING_SENDER_ID: "225578874852"
      VITE_ZIONCORE_2ND_FIREBASE_STORAGE_BUCKET: zioncore-2nd-production.firebasestorage.app
      VITE_ZIONCORE_2ND_FIREBASE_API_KEY: ${{ vars.ZIONCORE_2ND_FIREBASE_API_KEY }}
      VITE_ZIONCORE_2ND_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.ZIONCORE_2ND_APPCHECK_SITE_KEY }}
      VITE_ZIONCORE_2ND_FIREBASE_AUTH_SERVER_CONFIGURED: "true"
      VITE_ZIONCORE_2ND_FIREBASE_GOOGLE_AUTH_CONFIGURED: "false"
      VITE_ZIONCORE_2ND_FIREBASE_APPLE_AUTH_CONFIGURED: "false"
      VITE_ZIONCORE_2ND_FIRESTORE_CLIENT_ACCESS_APPROVED: "false"
      VITE_ZIONCORE_2ND_FIREBASE_AI_PROJECT_SECURITY_CONFIRMED: "false"
      ZIONCORE_2ND_GEMINI_AUTH_MODE: vertex-adc
      GOOGLE_CLOUD_PROJECT: zioncore-2nd-production
      GOOGLE_CLOUD_LOCATION: eu
      ZIONCORE_2ND_OPENAI_SECRET_NAME: ${{ vars.ZIONCORE_2ND_OPENAI_SECRET_NAME }}
      ZIONCORE_2ND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ZIONCORE_2ND_RUNTIME_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Java for Firebase emulator validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the independent deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOYER_SERVICE_ACCOUNT \
            ZIONCORE_2ND_RUNTIME_SERVICE_ACCOUNT \
            ZIONCORE_2ND_GEMINI_AUTH_MODE \
            GOOGLE_CLOUD_PROJECT \
            GOOGLE_CLOUD_LOCATION \
            VITE_ZIONCORE_2ND_FIREBASE_API_KEY \
            VITE_ZIONCORE_2ND_FIREBASE_APPCHECK_SITE_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required variable: ${key}" >&2
              exit 1
            fi
          done

      - name: Verify inventory and full release checks
        env:
          PORT: "18238"
          BASE_PATH: /
        run: |
          pnpm run inventory:check
          pnpm run verify:release
          pnpm audit --prod

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Confirm optional OpenAI fallback secret exists when configured
        shell: bash
        run: |
          set -euo pipefail
          require_enabled_openai_secret_version() {
            local secret_name="$1"
            local enabled_version
            gcloud secrets describe "$secret_name" \
              --project "$GCP_PROJECT_ID" >/dev/null
            enabled_version="$(gcloud secrets versions list "$secret_name" \
              --project "$GCP_PROJECT_ID" \
              --filter="state=ENABLED" \
              --format="value(name)" \
              --limit=1)"
            if [[ -z "$enabled_version" ]]; then
              echo "Secret ${secret_name} has no enabled version; add its ZionCore 2nd provider key in Secret Manager." >&2
              exit 1
            fi
          }

          if [[ -n "$ZIONCORE_2ND_OPENAI_SECRET_NAME" ]]; then
            require_enabled_openai_secret_version "$ZIONCORE_2ND_OPENAI_SECRET_NAME"
          fi
          echo "Gemini uses Vertex AI ADC; no Gemini key secret is required."
          echo "Optional OpenAI secret values are not read."

      - name: Deploy the API to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          cors_origins="https://zioncore-2nd-production.web.app,https://zioncore-2nd-production.firebaseapp.com"
          deploy_args=(
            gcloud run deploy "$API_SERVICE"
            --source .
            --project "$GCP_PROJECT_ID"
            --region "$GCP_REGION"
            --service-account "$ZIONCORE_2ND_RUNTIME_SERVICE_ACCOUNT"
            --allow-unauthenticated
            --min 0
            --max 5
            --cpu 1
            --memory 1Gi
            --timeout 300
            --set-env-vars="^|^NODE_ENV=production|ZIONCORE_2ND_ADMIN_AUTH_MODE=adc|ZIONCORE_2ND_GEMINI_AUTH_MODE=${ZIONCORE_2ND_GEMINI_AUTH_MODE}|GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}|GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}|ZIONCORE_2ND_PUBLIC_ORIGIN=${PUBLIC_ORIGIN}|CORS_ALLOWED_ORIGINS=${cors_origins}|ZIONCORE_CHECKOUT_MODE=disabled|ZIONCORE_LIVE_CHECKOUT_APPROVED=false|ZIONCORE_AUTOMATIC_TAX_ENABLED=false|ZIONCORE_PAID_USAGE_ENABLED=false|ZIONCORE_PREMIUM_FEATURES_ENABLED=false|ZIONCORE_STRIPE_MIRROR_ENABLED=false"
          )
          if [[ -n "$ZIONCORE_2ND_OPENAI_SECRET_NAME" ]]; then
            deploy_args+=(--set-secrets="OPENAI_API_KEY=${ZIONCORE_2ND_OPENAI_SECRET_NAME}:latest")
          fi
          "${deploy_args[@]}"

      - name: Verify the direct API health endpoint
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$api_url"
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 "$api_url/api/healthz" >/dev/null

      - name: Deploy the frontend and Firebase Hosting API rewrite
        working-directory: artifacts/zioncore-frequency-lab
        run: pnpm exec firebase deploy --only hosting --project zioncore-2nd-production --non-interactive

      - name: Verify public routes and same-origin API rewrite
        shell: bash
        run: |
          set -euo pipefail
          for path in / /lab /missions /astronomy /bioacoustics /voice-v2 /access /history /messages; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors \
              --retry-delay 5 "${PUBLIC_ORIGIN}${path}" >/dev/null
          done
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 "${PUBLIC_ORIGIN}/api/healthz" >/dev/null
